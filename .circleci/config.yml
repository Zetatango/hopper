version: 2
jobs:
  build:
    parallelism: 1
    working_directory: ~/hopper
    docker:
      - image: cimg/ruby:3.3.10

    steps:
      - checkout

      - run:
          name: Make dir ~/.ssh
          command: mkdir -p ~/.ssh

      - add_ssh_keys:
          fingerprints:
            - "SHA256:eucAAdtzXHlZTruU0vNskcJdvuFeCHTsddZFftZz/w8"

      - run:
          name: Set known hosts
          command: echo 'github.com ssh-rsa ' >> ~/.ssh/known_hosts

      - run:
          name: Install latest bundler
          command: gem install bundler

      - run:
          name: Bundle Install
          command: bundle install

      - run:
          name: Run rubocop
          command: |
            bundle exec rubocop --out test_results/rubocop.txt --format fuubar --config .rubocop.yml

      - run:
          name: Run bundle-audit
          command: |
            bundle exec bundle-audit check --update

      - run:
          name: Run rspec tests
          command: |
            bundle exec rspec \
              --profile 10 \
              --format RspecJunitFormatter \
              --out test_results/rspec.xml \
              --format progress

      - store_test_results:
          path: test_results

      - store_artifacts:
          path: test_results
          prefix: tests

      - store_artifacts:
          path: coverage
          prefix: coverage
